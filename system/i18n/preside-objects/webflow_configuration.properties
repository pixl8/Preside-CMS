fieldset.timeout.title=Timeout
fieldset.timeout.description=<p class="alert alert-info">The Inactive timeout (minutes) setting allows you to restrict the amount of time a user may be <em>inactive</em> before timing out their workflow progress. Progress is stored in the database, so this timeout can be large. Set the timeout to <strong>zero</strong> to indicate that there is to be <strong>no timeout</strong>.</p>