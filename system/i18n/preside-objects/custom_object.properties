field.has_label_field.title=Auto label field
field.has_label_field.help=When on, each record has a label as well as the created and modified dates. Dates are always stored.
field.label_field.title=Alternative label field
field.label_field.placeholder=Optionally choose a custom field to represent the label for your records.
field.label_field.help=Used wherever a record is shown by name, including related-record columns. Defaults to the record label. You can also choose a custom field.
