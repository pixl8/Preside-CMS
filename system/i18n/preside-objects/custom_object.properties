fieldset.labelfield.title=Label field
fieldset.labelfield.description=<p class="alert alert-info"><i class="fa fa-info-circle"></i> Choose <strong>Auto label field</strong> to include a field named 'label' for your records. Used wherever a record is shown by name, including related-record columns.</p>
fieldset.labelfield.description.edit=<p class="alert alert-info"><i class="fa fa-info-circle"></i> Choose <strong>Auto label field</strong> to include a field named 'label' for your records. Used wherever a record is shown by name, including related-record columns. If not using an automatic 'Label' field, you may choose a custom field to represent the label for your records.</p>
fieldset.access.description=Choose which user groups can see records and which can add, edit and delete them. A group that can manage records can also read them. Leaving both empty means nobody can access the records. Being able to edit this definition does not grant record access.
fieldset.confirm.title=

field.key.title=Unique Key
