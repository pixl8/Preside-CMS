title=URL Redirects
title.singular=URL Redirect
iconClass=fa-code-fork
description=Configure vanity and legacy URL redirects

field.label.title=Rule name
field.label.placeholder=e.g. 'Old site about us -> new about us page'
field.label.help=A unique name to help identify the rule internally.
field.label.slug.to.prefix=To: 
field.label.slug.from.prefix=From: 

field.source_url_pattern.title=Incoming URL
field.source_url_pattern.placeholder=e.g. '/en/about-us.php'
field.source_url_pattern.help=URL pattern that, if matched, will trigger the redirect

field.exact_match_only.title=Exact matches only
field.exact_match_only.help=If true, then only URLs that exactly match the URL provided will trigger the redirect. If false, the engine will only attempt to match the first part of the URL.
field.exact_match_only.false.warning=Removing this setting could mean that any child pages may be included in the redirect rule. If unsure, leave exact matching on.

field.redirect_to_link.title=Redirect to
field.redirect_to_link.help=Choose or add a link that the request will be redirected to when matching the incoming URL pattern

field.redirect_type.title=Redirect type
field.redirect_type.help=Whether the redirect is a permanent or temporary redirect. If in doubt, choose the default 'permanent' redirect.
field.redirect_type.301.warning=301 redirects are permanent changes that get cached in your browser, making them difficult to undo and retest. If you make a mistake in your redirect configuration, visitors who have already cached the redirect will continue to be sent to the wrong destination until their cache is cleared. During development or when making URL structure changes, it’s safer to use 302 redirect until you’re confident everything works correctly and can set it to a 301 to ensure the page equity is transferred for SEO reasons.

field.keep_query_string.title=Preserve URL parameters
field.keep_query_string.help=If true, any URL parameters found at the incoming URL will be added to the target URL.

field.redirect_to_url.title=Redirect to URL