simpledot.label=Simple dot
simpledot.description=A clean and minimal progress indicator using only dots to represent each step. Ideal for processes where visual simplicity is key and step names are either not needed or explained elsewhere.

dotwithtext.label=Progress with step title
dotwithtext.description=Each dot is accompanied by a label that describes the step it represents. This layout strikes a balance between visual clarity and informational guidance, helping users track their current position and understand what’s next.
dotwithtext.cssclass=mod-progress-bar-2

textbased.label=Text based
textbased.description=Displays only the current step in the format: “Step X of Y” along with the title of the current step. This layout focuses on clarity and minimalism, showing just enough context to orient the user without overwhelming them with the full step list.
textbased.cssclass=mod-progress-bar-text-based
textbased.progress.title=Step {1} of {2}