version: 1.0.0
workflow:
  id: draftDefault

  initialActions:
  - id: start
    result:
      activateSteps: [ "draft" ]

  steps:
  - id: draft
    actions:
    - id: review
      result:
        activateSteps: [ "review" ]

  - id: review
    actions:
    - id: approve
      result:
        activateSteps: [ "publish" ]
        preHandlers:
        - event: admin.DraftManager.preApproveAction
    - id: reject
      result:
        activateSteps: [ "draft" ]

  - id: publish
